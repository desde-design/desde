name: CLA Assistant

# Asks a first-time contributor to sign CLA.md, then remembers that they did.
#
# Uses contributor-assistant/github-action, pinned to v2.6.1 (the latest tag
# as of 2026-09-01; check the action's own releases before bumping it. Its
# repo is archived as of this writing, "no longer actively maintained," but
# the existing tags remain functional, and v2.6.1 is what this workflow is
# pinned to).
#
# Signatures are stored as a JSON file, NOT on main. They land on a separate
# branch, cla-signatures, that this action commits to directly (that branch
# must stay unprotected, since the action pushes to it with no PR). See the
# action's README for why: https://github.com/contributor-assistant/github-action
#
# pull_request_target (not pull_request) is required so this workflow runs
# with write access to the base repo even for a pull request from a fork.
# issue_comment is required so the "I have read the CLA Document..." reply
# itself re-triggers a check.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/signatures/cla.json'
          path-to-document: 'https://github.com/desde-design/desde/blob/main/CLA.md'
          branch: 'cla-signatures'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          allowlist: mochang,bot*
