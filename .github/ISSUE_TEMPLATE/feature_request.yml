name: Feature request
description: Suggest an idea or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Desde has one maintainer, so not everything can
        be built right away, but every suggestion gets read.

  - type: dropdown
    id: surface
    attributes:
      label: Which surface is this about?
      options:
        - Editor CLI
        - Editor desktop app
        - Viewer
        - Docs (website)
        - Something else, or not surface-specific
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, and what is missing or awkward about it today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Your proposed solution. A rough idea is fine if you do not have a full one.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
    validations:
      required: false
