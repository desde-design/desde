# Weekly dependency PRs, grouped so a solo maintainer sees a few PRs a week,
# not forty. Security advisories still arrive on their own, immediately.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /editor-cli
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /viewer
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
